apiVersion: manoir/v1
kind: AvailablePlugin

repoUrl: https://github.com/manoir-app/manoir-plugin-sarah
displayName: Sarah Home Agent
publisher: MaNoir
version: 2.3.1
minimumMaNoirVersion: 1.8.0

documentation:
  overviewPath: 
    fr-FR: overview.fr.md
    en-US: overview.md
  setupPath: 
    en-US: setup.md

requiredPlugins:
  - repoUrl: https://github.com/manoir-app/manoir-plugin-core-mqtt
    minVersion: 1.2.0
    optional: false
    reason:
      fr-FR: Nécessaire pour la publication MQTT.
      en-US: Required for MQTT publication.

announcedContributions:
  - kind: integration
    labels:
      fr-FR: Intégrations domotiques
      en-US: Home integrations

  - kind: adminui.page
    labels:
      fr-FR: Pages d’administration
      en-US: Administration pages

deployment:
  artifacts:
    - kind: compose
      path: deploy/docker-compose.yml
    - kind: env-template
      path: deploy/.env.template
