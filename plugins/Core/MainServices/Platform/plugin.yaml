apiVersion: manoir/v1
kind: AvailablePlugin
repoUrl: https://github.com/manoir-app/MaNoir.Platform
displayName: MaNoir Platform Core
publisher: MaNoir
version: 0.1.59
minimumMaNoirVersion: 0.0.0
announcedContributions:
  - kind: adminui.page
    labels:
      en: Core admin
deployment:
  group: platform
  adminUi:
    pathPrefix: /platform
    composeService: core
    port: 8080
  artifacts:
    - kind: compose
      path: deploy/docker-compose.yml
